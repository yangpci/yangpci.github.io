---
layout: default
---

<article class="essay">
  <div class="essay-body">
    {{ content }}
  </div>
  <p class="essay-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y年%-m月%-d日" }}</time>
    <span>{{ site.title }}</span>
  </p>
</article>

<style>
  body:has(.essay) {
    background: #f4efe6;
    color: #2b2723;
  }

  body:has(.essay) .site-header,
  body:has(.essay) .site-footer {
    display: none;
  }

  .essay {
    max-width: 38rem;
    margin: 4.5rem auto 3rem;
  }

  .essay-body {
    font-family: "Songti SC", "Noto Serif SC", "Source Han Serif SC", Palatino, "Palatino Linotype", serif;
    font-size: 1.16rem;
    line-height: 2.15;
    letter-spacing: 0.045em;
  }

  .essay-body p {
    margin: 0 0 1.55em;
    text-align: justify;
  }

  .essay-body p:first-of-type::first-letter {
    float: left;
    margin: 0.12em 0.08em 0 0;
    color: #7a5340;
    font-size: 3.15rem;
    line-height: 0.82;
  }

  .essay-meta {
    margin: 3.2rem 0 0;
    color: #9a8d80;
    font-family: "Songti SC", "Noto Serif SC", Palatino, serif;
    font-size: 0.92rem;
    letter-spacing: 0.12em;
    line-height: 1.9;
    text-align: right;
  }

  .essay-meta time,
  .essay-meta span {
    display: block;
  }

  @media (max-width: 600px) {
    .essay {
      margin-top: 2.4rem;
    }

    .essay-body {
      font-size: 1.08rem;
      line-height: 2.05;
    }
  }
</style>
