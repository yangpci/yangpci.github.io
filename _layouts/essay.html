---
layout: default
---

<article class="essay">
  <header class="essay-header">
    <p class="essay-kicker">文字</p>
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y年%-m月%-d日" }}</time>
  </header>
  <div class="essay-body">
    {{ content }}
  </div>
</article>

<style>
  body:has(.essay) {
    background: #f4efe6;
    color: #2b2723;
  }

  body:has(.essay) .site-header {
    border-top: none;
    border-bottom: 1px solid rgba(43, 39, 35, 0.08);
    background: transparent;
  }

  .essay {
    max-width: 38rem;
    margin: 1.5rem auto 5rem;
  }

  .essay-header {
    margin: 3.2rem 0 3rem;
    text-align: center;
  }

  .essay-kicker {
    margin: 0;
    color: #8d735c;
    font-size: 0.78rem;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
  }

  .essay h1 {
    margin: 0.85rem 0 0.7rem;
    color: #2b2723;
    font-family: "Songti SC", "Noto Serif SC", "Source Han Serif SC", Palatino, "Palatino Linotype", serif;
    font-size: 2.15rem;
    font-weight: 500;
    letter-spacing: 0.22em;
    line-height: 1.4;
    text-indent: 0.22em;
  }

  .essay time {
    color: #9a8d80;
    font-family: "Songti SC", "Noto Serif SC", Palatino, serif;
    font-size: 0.92rem;
    letter-spacing: 0.14em;
  }

  .essay-body {
    font-family: "Songti SC", "Noto Serif SC", "Source Han Serif SC", Palatino, "Palatino Linotype", serif;
    font-size: 1.16rem;
    line-height: 2.15;
    letter-spacing: 0.045em;
  }

  .essay-body p {
    margin: 0 0 1.55em;
    text-align: justify;
  }

  .essay-body p:first-of-type::first-letter {
    float: left;
    margin: 0.12em 0.08em 0 0;
    color: #7a5340;
    font-size: 3.15rem;
    line-height: 0.82;
  }

  .essay-body p:last-child {
    margin: 2.6em 0 0;
    color: #4e453d;
    text-align: center;
    letter-spacing: 0.18em;
  }

  @media (max-width: 600px) {
    .essay {
      margin-top: 0.4rem;
    }

    .essay-header {
      margin-top: 2rem;
    }

    .essay h1 {
      font-size: 1.7rem;
    }

    .essay-body {
      font-size: 1.08rem;
      line-height: 2.05;
    }
  }
</style>
